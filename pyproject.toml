[project]
name = "archival-organizer"
version = "0.1.1"
description = "AI-assisted grouping and labelling of ordered archival scans"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=1.100.0",
    "pillow>=11.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
archival-organizer = "archival_organizer.cli:main"
archival-browser = "archival_organizer.viewer:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["archival_organizer*"]

[tool.setuptools.package-data]
archival_organizer = ["web/templates/*.html", "web/static/*"]
